# Sex workers, inte "auto". Mätt 2026-08-16 på maskinen (12 trådar),
# 1068 tester: -n 6 tar 128 s, -n auto (12) tar 168 s och dubbelt så mycket
# CPU-tid. Fler workers än sex överbelastar - varje worker sätter upp en egen
# testdatabas, och de konkurrerar om disk och minne i stället för att räkna.
# Felsök seriellt med -n0 för läsbar per-test-output.
[pytest]
DJANGO_SETTINGS_MODULE = AxeCollection.settings
django_find_project = false
addopts = 
    --strict-markers
    --strict-config
    --tb=short
    --cov=axes
    --cov-report=html
    --cov-report=term-missing
    --cov-fail-under=70
    -n 6
    --dist=loadscope
    --reuse-db
    --durations=10
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_* 